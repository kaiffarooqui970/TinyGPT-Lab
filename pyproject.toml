[project]
name = "tinygpt"
version = "0.1.0"
description = "GPT from scratch, scaling laws, and sparse-autoencoder interpretability in plain PyTorch."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "datasets>=2.20",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinygpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
