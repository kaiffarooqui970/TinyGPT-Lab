# Residual stream after 3 blocks of S4 (half depth). Same data_seed + batch_size as the other
# collections, so the first 2,097,152 tokens are identical across models (needed for Phase 9).
checkpoint: "runs/sweeps/scaling/*_s4_*/ckpt_final.pt"
layer: 3
data_dir: data/tinystories
split: train
n_tokens: 2097152
batch_size: 64
data_seed: 777
out_dir: data/acts/s4_l3
shard_tokens: 1048576
device: auto
