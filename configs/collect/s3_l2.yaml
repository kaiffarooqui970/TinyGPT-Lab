# Residual stream after 2 blocks of S3 (half depth). Sequential non-overlapping windows from the
# held-out val split: identical tokens across models (Phase 9), each used once.
checkpoint: "runs/sweeps/scaling/*_s3_*/ckpt_final.pt"
layer: 2
data_dir: data/tinystories
split: val
sequential: true
n_tokens: 2097152
batch_size: 64
data_seed: 777
out_dir: data/acts/s3_l2
shard_tokens: 1048576
device: auto
