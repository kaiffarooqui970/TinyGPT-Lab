# Residual stream after 2 blocks of S3 (half depth). Same data_seed + batch_size as the other
# collections, so the first 2,097,152 tokens are identical across models (needed for Phase 9).
checkpoint: "runs/sweeps/scaling/*_s3_*/ckpt_final.pt"
layer: 2
data_dir: data/tinystories
split: train
n_tokens: 2097152
batch_size: 64
data_seed: 777
out_dir: data/acts/s3_l2
shard_tokens: 1048576
device: auto
