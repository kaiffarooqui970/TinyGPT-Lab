# Phase 4 acceptance model and the largest scaling point (S5): 6 x 384, ~10.6M non-embedding
# params, 20 tokens/param (~212M tokens). Weight snapshots are kept log-spaced along training.
name: s5_10m
seed: 0
data_seed: 0
model: {vocab_size: 8192, block_size: 256, n_layer: 6, n_head: 6, d_model: 384}
data_dir: data/tinystories
tokenizer_path: data/tokenizer/tinystories_8k.json
batch_size: 32
grad_accum: 1
tokens_per_param: 20.0
lr: 1.0e-3
min_lr_ratio: 0.1
warmup_frac: 0.05
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
dtype: bf16
device: auto
log_interval: 50
eval_interval: 500
eval_batches: 20
final_eval_batches: 200
eval_batch_size: 32
sample_interval: 2500
ckpt_interval: 2500
keep_ckpt_steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000]
