# Shared training setup for every TinyStories run (Phases 4-5). Model shape and LR are
# set per run (see configs/sweeps/*). 32 x 256 = 8192 tokens per optimiser step.
name: base
seed: 0
data_seed: 0
model:
  vocab_size: 8192
  block_size: 256
  n_layer: 6
  n_head: 6
  d_model: 384
data_dir: data/tinystories
tokenizer_path: data/tokenizer/tinystories_8k.json
batch_size: 32
grad_accum: 1
tokens_per_param: 20.0
lr: 1.0e-3
min_lr_ratio: 0.1
warmup_frac: 0.05
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
dtype: bf16
device: auto
log_interval: 50
eval_interval: 500
eval_batches: 20
final_eval_batches: 200
eval_batch_size: 32
sample_interval: 2500
ckpt_interval: 2500
